    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 text-white flex items-center justify-center text-lg shadow-lg font-heading">
                <i class="fa-solid fa-satellite-dish"></i>
            </div>
            <h1 class="font-heading font-bold text-base text-slate-100">
                Async vs Sync Communication Visualizer
            </h1>
        </div>

        <!-- Controls Bar -->
        <div class="flex items-center space-x-3">
            <!-- Mode Switcher -->
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                <button onclick="setMode('sync')" id="btn-sync" class="px-3 py-1.5 rounded-lg font-bold transition text-slate-400 hover:bg-slate-800">
                    Sync Request (Blocking)
                </button>
                <button onclick="setMode('async')" id="btn-async" class="px-3 py-1.5 rounded-lg font-bold transition bg-emerald-950 text-emerald-300 border border-emerald-700/60">
                    Async Request (Callback)
                </button>
            </div>

            <!-- Auto Play & Reset -->
            <button id="btn-play" onclick="togglePlay()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition flex items-center space-x-1">

                <span id="play-text">Pause</span>
            </button>
            <button onclick="resetSim()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs border border-slate-700 transition">
                <i class="fa-solid fa-rotate-right"></i>
            </button>

            <!-- Download Button -->
            <button onclick="downloadSelf()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center space-x-1 shadow-md">
                <i class="fa-solid fa-download"></i>
                <span>Save HTML</span>
            </button>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-1 p-6 max-w-[1400px] mx-auto w-full flex flex-col justify-center space-y-6">

        <!-- Quick Trigger Buttons for Requests -->
        <div class="flex items-center justify-center space-x-4">
            <button onclick="triggerRequest('pizza')" class="px-5 py-2.5 bg-sky-950 hover:bg-sky-900 border border-sky-700/60 rounded-2xl text-xs font-bold text-sky-300 flex items-center space-x-2 shadow-lg transition">
                <i class="fa-solid fa-paper-plane text-sky-400 text-sm"></i>
                <span>Send Pizza API Request</span>
            </button>
            <button onclick="triggerRequest('coffee')" class="px-5 py-2.5 bg-purple-950 hover:bg-purple-900 border border-purple-700/60 rounded-2xl text-xs font-bold text-purple-300 flex items-center space-x-2 shadow-lg transition">
                <i class="fa-solid fa-paper-plane text-purple-400 text-sm"></i>
                <span>Send Coffee API Request</span>
            </button>
            <button onclick="triggerLocalTask()" class="px-5 py-2.5 bg-amber-950 hover:bg-amber-900 border border-amber-700/60 rounded-2xl text-xs font-bold text-amber-300 flex items-center space-x-2 shadow-lg transition">
                <i class="fa-solid fa-carrot text-emerald-400 text-sm"></i>
                <span>Client Work: Prep Local Salad</span>
            </button>
        </div>

        <!-- 3 AGENT STAGE CANVAS -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 flex-1 flex flex-col justify-between relative shadow-2xl overflow-hidden min-h-[460px]">
            
            <!-- Dynamic Request / Response Packet -->
            <div id="comm-packet" class="absolute px-3 py-1.5 rounded-full bg-gradient-to-tr from-amber-400 to-orange-500 text-slate-950 font-bold text-xs shadow-2xl z-30 comm-packet flex items-center space-x-1.5 border border-amber-200 hidden" style="left: 16%; top: 40%;">
                <i id="packet-icon" class="fa-solid fa-reply text-emerald-950"></i>
                <span id="packet-label" class="font-mono text-[11px]">CALLBACK: COFFEE</span>
            </div>

            <!-- 3 PHYSICAL AGENTS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 my-auto z-10">

                <!-- AGENT 1: Client / Chef Agent -->
                <div class="flex flex-col items-center">
                    <div id="agent-chef-card" class="w-full bg-slate-950 border-2 border-amber-500/60 rounded-3xl p-6 flex flex-col items-center text-center relative transition-all duration-300 shadow-xl">
                        
                        <div id="chef-svg-container" class="w-28 h-28 relative mb-3 animate-float">
                            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
                                <path d="M30 35 C 30 15, 40 10, 50 10 C 60 10, 70 15, 70 35 Z" fill="#ffffff"></path>
                                <rect x="30" y="30" width="40" height="8" fill="#e2e8f0" rx="2"></rect>
                                <rect x="25" y="38" width="50" height="42" rx="12" fill="#f59e0b"></rect>
                                <circle cx="40" cy="54" r="5" fill="#0f172a"></circle>
                                <circle cx="60" cy="54" r="5" fill="#0f172a"></circle>
                                <path d="M 42 66 Q 50 72 58 66" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"></path>
                            </svg>
                        </div>

                        <div class="font-heading font-bold text-base text-amber-300">Client Agent (Requestor)</div>
                        
                        <div class="w-full bg-slate-900 rounded-full h-3 mt-4 overflow-hidden border border-slate-800">
                            <div id="chef-progress" class="bg-amber-400 h-full w-0 transition-all duration-200" style="width: 0%;"></div>
                        </div>
                        <span id="chef-status-text" class="text-xs font-mono font-bold text-emerald-400 mt-2">IDLE / READY</span>

                        <!-- Frozen / Blocked Shield Overlay -->
                        <div id="chef-frozen-overlay" class="absolute inset-0 bg-red-950/90 rounded-3xl border-2 border-red-500 backdrop-blur-sm flex flex-col items-center justify-center p-3 z-20 hidden">
                            <i class="fa-solid fa-lock text-red-400 text-4xl animate-bounce mb-2"></i>
                            <span class="font-heading font-bold text-sm text-red-200">BLOCKED WAITING RESPONSE</span>
                        </div>
                    </div>
                </div>

                <!-- AGENT 2: Remote Server Node 1 (Oven API) -->
                <div class="flex flex-col items-center">
                    <div id="agent-oven-card" class="w-full bg-slate-950 border border-slate-800 rounded-3xl p-6 flex flex-col items-center text-center relative transition-all duration-300 shadow-xl">
                        
                        <div id="oven-svg-container" class="w-28 h-28 relative mb-3 animate-float">
                            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
                                <rect x="25" y="25" width="50" height="55" rx="14" fill="#38bdf8"></rect>
                                <rect x="33" y="33" width="34" height="22" rx="6" fill="#0f172a"></rect>
                                <path d="M 38 44 Q 44 38 50 44 Q 56 50 62 44" stroke="#f97316" stroke-width="2.5" fill="none"></path>
                                <circle cx="40" cy="67" r="4" fill="#0f172a"></circle>
                                <circle cx="60" cy="67" r="4" fill="#0f172a"></circle>
                            </svg>
                        </div>

                        <div class="font-heading font-bold text-base text-sky-300">Remote Server 1 (Pizza API)</div>

                        <div class="w-full bg-slate-900 rounded-full h-3 mt-4 overflow-hidden border border-slate-800">
                            <div id="oven-progress" class="bg-sky-400 h-full w-0 transition-all duration-200" style="width: 0%;"></div>
                        </div>
                        <span id="oven-status-text" class="text-xs font-mono text-slate-500 mt-2">STANDBY</span>
                    </div>
                </div>

                <!-- AGENT 3: Remote Server Node 2 (Barista API) -->
                <div class="flex flex-col items-center">
                    <div id="agent-coffee-card" class="w-full bg-slate-950 border border-slate-800 rounded-3xl p-6 flex flex-col items-center text-center relative transition-all duration-300 shadow-xl">
                        
                        <div id="coffee-svg-container" class="w-28 h-28 relative mb-3 animate-float">
                            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
                                <rect x="25" y="25" width="50" height="55" rx="14" fill="#a855f7"></rect>
                                <rect x="33" y="33" width="34" height="20" rx="4" fill="#0f172a"></rect>
                                <path d="M 42 40 L 58 40 L 54 48 L 46 48 Z" fill="#64748b"></path>
                                <circle cx="40" cy="65" r="4" fill="#0f172a"></circle>
                                <circle cx="60" cy="65" r="4" fill="#0f172a"></circle>
                            </svg>
                        </div>

                        <div class="font-heading font-bold text-base text-purple-300">Remote Server 2 (Coffee API)</div>

                        <div class="w-full bg-slate-900 rounded-full h-3 mt-4 overflow-hidden border border-slate-800">
                            <div id="coffee-progress" class="bg-purple-400 h-full w-0 transition-all duration-200" style="width: 0%;"></div>
                        </div>
                        <span id="coffee-status-text" class="text-xs font-mono text-slate-500 mt-2">STANDBY</span>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- Communication Logic Script -->
    <script>
        let currentMode = 'async'; 
        let isPlaying = false;
        let currentTime = 0;
        let timer = null;
        let activeIntervals = [];

        function setMode(mode) {
            resetSim();
            currentMode = mode;
            
            const btnSync = document.getElementById('btn-sync');
            const btnAsync = document.getElementById('btn-async');

            if (mode === 'sync') {
                btnSync.className = 'px-3 py-1.5 rounded-lg font-bold transition bg-red-950 text-red-300 border border-red-700/60';
                btnAsync.className = 'px-3 py-1.5 rounded-lg font-bold transition text-slate-400 hover:bg-slate-800';
            } else {
                btnAsync.className = 'px-3 py-1.5 rounded-lg font-bold transition bg-emerald-950 text-emerald-300 border border-emerald-700/60';
                btnSync.className = 'px-3 py-1.5 rounded-lg font-bold transition text-slate-400 hover:bg-slate-800';
            }
        }

        function togglePlay() {
            if (isPlaying) {
                pauseSim();
            } else {
                startSim();
            }
        }

        function triggerRequest(type) {
            if (currentMode === 'sync') {
                runSyncCommunicationSequence(type);
            } else {
                runAsyncCommunicationSequence(type);
            }
        }

        function sendPacket(fromPos, toPos, label, isResponse, callback) {
            const packet = document.getElementById('comm-packet');
            const icon = document.getElementById('packet-icon');
            const labelEl = document.getElementById('packet-label');

            labelEl.textContent = label;
            icon.className = isResponse ? 'fa-solid fa-reply text-emerald-950' : 'fa-solid fa-paper-plane text-slate-950';

            packet.classList.remove('hidden');
            packet.style.left = fromPos;
            packet.style.top = '40%';

            setTimeout(() => {
                packet.style.left = toPos;
            }, 50);

            setTimeout(() => {
                packet.classList.add('hidden');
                if (callback) callback();
            }, 800);
        }

        function triggerLocalTask() {
            const chefOverlay = document.getElementById('chef-frozen-overlay');
            if (!chefOverlay.classList.contains('hidden')) {
                return; // Thread is blocked in sync mode
            }
            const chefProgress = document.getElementById('chef-progress');
            let p = 0;
            const iv = setInterval(() => {
                p += 10;
                if (p > 100) p = 100;
                chefProgress.style.width = `${p}%`;
                document.getElementById('chef-status-text').textContent = p === 100 ? 'DONE (100%)' : `PREP SALAD (${p}%)`;
                if (p >= 100) {
                    clearInterval(iv);
                    setTimeout(() => {
                        document.getElementById('chef-status-text').textContent = 'IDLE / READY';
                        chefProgress.style.width = '0%';
                    }, 1000);
                }
            }, 100);
            activeIntervals.push(iv);
        }

        function runSyncCommunicationSequence(type) {
            const isPizza = type === 'pizza';
            const targetPos = isPizza ? '50%' : '83%';
            const serverProgress = document.getElementById(isPizza ? 'oven-progress' : 'coffee-progress');
            const serverStatus = document.getElementById(isPizza ? 'oven-status-text' : 'coffee-status-text');
            const chefOverlay = document.getElementById('chef-frozen-overlay');

            // 1. Send Request & Freeze Client Immediately
            chefOverlay.classList.remove('hidden');
            sendPacket('16%', targetPos, `REQ: ${type.toUpperCase()}`, false, () => {
                // 2. Server Processes Request
                let p = 0;
                const iv = setInterval(() => {
                    p += 10;
                    if (p > 100) p = 100;
                    serverProgress.style.width = `${p}%`;
                    serverStatus.textContent = p === 100 ? 'DONE (100%)' : `PROCESSING (${p}%)`;
                    if (p >= 100) {
                        clearInterval(iv);
                        // 3. Send Response Back
                        sendPacket(targetPos, '16%', `RES: ${type.toUpperCase()}`, true, () => {
                            chefOverlay.classList.add('hidden');
                            document.getElementById('chef-status-text').textContent = 'PAYLOAD RECEIVED (100%)';
                            setTimeout(() => {
                                document.getElementById('chef-status-text').textContent = 'IDLE / READY';
                                serverProgress.style.width = '0%';
                                serverStatus.textContent = 'STANDBY';
                            }, 1200);
                        });
                    }
                }, 120);
                activeIntervals.push(iv);
            });
        }

        function runAsyncCommunicationSequence(type) {
            const isPizza = type === 'pizza';
            const targetPos = isPizza ? '50%' : '83%';
            const serverProgress = document.getElementById(isPizza ? 'oven-progress' : 'coffee-progress');
            const serverStatus = document.getElementById(isPizza ? 'oven-status-text' : 'coffee-status-text');

            // 1. Send Request with Callback ID (Client STAYS UNBLOCKED)
            sendPacket('16%', targetPos, `REQ: ${type.toUpperCase()} + Callback`, false, () => {
                // 2. Server Processes in Background while Client works locally
                let p = 0;
                const iv = setInterval(() => {
                    p += 10;
                    if (p > 100) p = 100;
                    serverProgress.style.width = `${p}%`;
                    serverStatus.textContent = p === 100 ? 'DONE (100%)' : `PROCESSING (${p}%)`;
                    if (p >= 100) {
                        clearInterval(iv);
                        // 3. Send Callback Response back to Client
                        sendPacket(targetPos, '16%', `CALLBACK: ${type.toUpperCase()}`, true, () => {
                            document.getElementById('chef-status-text').textContent = `CALLBACK FIRED (${type.toUpperCase()})`;
                            setTimeout(() => {
                                document.getElementById('chef-status-text').textContent = 'IDLE / READY';
                                serverProgress.style.width = '0%';
                                serverStatus.textContent = 'STANDBY';
                            }, 1200);
                        });
                    }
                }, 120);
                activeIntervals.push(iv);
            });

            // Client immediately does local work while waiting
            triggerLocalTask();
        }

        function startSim() {
            resetSim();
            isPlaying = true;
            document.getElementById('play-icon').className = 'fa-solid fa-pause';
            document.getElementById('play-text').textContent = 'Pause';
            
            if (currentMode === 'sync') {
                runSyncCommunicationSequence('pizza');
                setTimeout(() => {
                    if (isPlaying) runSyncCommunicationSequence('coffee');
                }, 3600);
            } else {
                runAsyncCommunicationSequence('pizza');
                setTimeout(() => {
                    if (isPlaying) runAsyncCommunicationSequence('coffee');
                }, 1500);
            }
        }

        function pauseSim() {
            isPlaying = false;
            clearInterval(timer);
            activeIntervals.forEach(clearInterval);
            activeIntervals = [];
            document.getElementById('play-icon').className = 'fa-solid fa-play';
            document.getElementById('play-text').textContent = 'Auto Play';
        }

        function resetSim() {
            pauseSim();
            currentTime = 0;
            document.getElementById('chef-progress').style.width = '0%';
            document.getElementById('oven-progress').style.width = '0%';
            document.getElementById('coffee-progress').style.width = '0%';

            document.getElementById('chef-status-text').textContent = 'IDLE / READY';
            document.getElementById('oven-status-text').textContent = 'STANDBY';
            document.getElementById('coffee-status-text').textContent = 'STANDBY';

            document.getElementById('chef-frozen-overlay').classList.add('hidden');
            document.getElementById('comm-packet').classList.add('hidden');
        }

        function downloadSelf() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'async_communication_visualizer.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        setMode('async');
    </script>

</body></html>
